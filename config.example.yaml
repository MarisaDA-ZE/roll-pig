# 复制为工作目录中的 config.yaml 后使用，环境变量优先于此文件中的配置。
server:
  host: 0.0.0.0
  port: 3000
  trustProxy: false

roll:
  timezone: Asia/Shanghai
  # 生产环境请使用私有且稳定的密钥，也可通过 ROLL_SECRET 环境变量设置。
  secret: change-me

assets:
  baseUrl: ""

limits:
  # 所有接口和静态图片共用活动名额；图片传输完成后才释放。
  maxConcurrency: 64
  # 等待队列容量，设为 0 时不排队。
  maxQueueSize: 128
  queueTimeoutMs: 3000
  # 从获得名额开始计时，包含请求体接收和响应传输。
  requestTimeoutMs: 5000
  # URL、Header 和 Body 的大小以字节为单位。
  maxUrlBytes: 2048
  maxHeaderBytes: 16384
  maxBodyBytes: 16384
